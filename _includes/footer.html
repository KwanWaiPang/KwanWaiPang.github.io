<!-- 插入一系列svg的按钮 -->
{% include svg-icons.html %}

<!-- 插入添加的文字 -->
{% if site.footer-text %}
<p>{{ site.footer-text }}</p>
{% endif %}


<!-- 载入GitHub按钮库 -->
<script async defer src="https://buttons.github.io/buttons.js"></script>
<!-- Star按钮 -->
<a class="github-button"
  href="https://github.com/KwanWaiPang/KwanWaiPang.github.io"
  data-icon="octicon-star"
  data-size="large"
  data-show-count="true"
  aria-label="Star it on GitHub">Star on Github</a>
<!-- Visits 统计（style=social 更接近 GitHub 按钮风格） -->
<img
  src="https://badges.strrl.dev/visits/KwanWaiPang/KwanWaiPang?style=social&label=Visits"
  alt="Visits"
  style="vertical-align: middle; margin-left: 8px;">
